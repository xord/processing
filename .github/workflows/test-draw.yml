name: Test Draw

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: setup gems
        run: bundle install

      - name: setup xot
        run: git clone -q --depth 1 https://github.com/xord/xot.git "${{ runner.temp }}/xot"

      - name: setup dependencies
        env:
          RUBYLIB: ${{ runner.temp }}/xot/lib
        run: ruby -rxot/rake -e 'setup_dependencies'

      - name: setup chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: test
        run: rake verbose test:draw
